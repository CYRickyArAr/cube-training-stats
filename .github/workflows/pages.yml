name: Read Tencent and publish statistics
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
concurrency:
  group: statistics-pages
  cancel-in-progress: false
jobs:
  read:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test publication privacy rules
        run: node --test tests/*.test.cjs
      - name: Read sole source and prepare safe snapshot
        env:
          SOURCE_CONFIG: ${{ secrets.SOURCE_CONFIG }}
          CUBE_RUNTIME_DIR: ${{ runner.temp }}/cube-read
        run: node publish.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: safe-statistics
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: safe-statistics
          path: public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy safe snapshot
        id: deployment
        uses: actions/deploy-pages@v5
