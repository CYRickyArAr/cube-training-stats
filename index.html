<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>智能练习</title>
  <link rel="stylesheet" href="styles.css">
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="智能练习首页"><span class="cube-mark" aria-hidden="true">▦</span><span>智能练习</span></a>
    <div class="top-actions"><a id="source-link" class="button-link" target="_blank" rel="noopener noreferrer" aria-disabled="true">打开腾讯文档</a><button id="refresh-data" type="button">刷新快照</button><button id="export-csv" type="button" disabled>导出 CSV</button></div>
    <section class="sync-card" aria-label="腾讯文档读取状态">
      <div class="sync-heading"><strong id="sync-status" role="status" aria-live="polite">正在读取腾讯文档…</strong><label class="auto-sync-label"><input id="auto-sync" type="checkbox" checked>每 60 秒检查新快照</label></div>
      <p id="last-success" class="muted">成绩更新时间：尚未加载快照</p>
    </section>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="section-heading"><span>训练人员</span><span id="people-count" class="badge">0</span></div>
      <nav id="people-list" aria-label="训练人员列表"></nav>
    </aside>
    <main id="stats-main" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section id="source-warnings" class="source-warnings" aria-label="腾讯源表读取警告" hidden></section>
      <div class="page-heading">
        <div id="person-heading" class="person-heading" hidden><div class="person-identity"><span id="active-avatar" class="avatar">人</span><div><h1 id="person-title"></h1><p id="person-subtitle" class="muted"></p></div></div></div>
        <h1 id="view-title">训练统计</h1>
        <div class="tabs" role="tablist" aria-label="统计视图"><button id="personal-tab" role="tab" aria-selected="true" aria-controls="personal-panel" type="button">个人分析</button><button id="comparison-tab" role="tab" aria-selected="false" aria-controls="comparison-panel" type="button">多人对比</button></div>
        <div class="range-label"><label for="range">统计范围</label><div class="range-controls"><select id="range"><option value="0">全部记录</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option><option value="day">指定日期</option></select><span class="date-picker-slot"><input id="range-date" type="date" readonly role="button" aria-label="选择具体训练日期" aria-haspopup="dialog" aria-expanded="false" aria-controls="date-calendar" title="点击打开日历，选中日期后保持展开" hidden><span id="date-calendar" class="date-calendar" role="dialog" aria-label="选择训练日期" hidden><span class="calendar-heading"><button id="calendar-prev" type="button" aria-label="上个月">‹</button><strong id="calendar-month" aria-live="polite"></strong><button id="calendar-next" type="button" aria-label="下个月">›</button></span><span class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></span><span id="calendar-days" class="calendar-days" role="group" aria-label="训练日期"></span><span class="calendar-footer"><button id="calendar-clear" type="button">清除</button><span>选日期不关闭 · 点外部关闭</span><button id="calendar-today" type="button">今天</button></span></span></span></div></div>
      </div>
      <section id="welcome" class="welcome card"><span class="welcome-symbol" aria-hidden="true">▦</span><h2 id="welcome-title">正在读取腾讯文档</h2><p id="welcome-text" hidden></p></section>
      <section id="personal-panel" role="tabpanel" aria-labelledby="personal-tab" hidden>
        <div class="metrics">
          <article class="card metric"><span>最佳 ao5</span><strong id="metric-best">—</strong></article>
          <article class="card metric"><span>平均 ao5</span><strong id="metric-mean">—</strong></article>
          <article class="card metric"><span>中位数 ao5</span><strong id="metric-median">—</strong></article>
          <article class="card metric"><span>Sub7 率</span><strong id="metric-sub7">—</strong><small id="sub7-caption" hidden></small></article>
        </div>
        <div class="overview-grid">
          <section class="card chart-card"><div class="card-heading"><h3 id="chart-title">日均 ao5 趋势</h3><div class="chart-switch" role="group" aria-label="选择图表"><button id="trend-chart-tab" type="button" aria-pressed="true" aria-controls="chart">趋势</button><button id="histogram-chart-tab" type="button" aria-pressed="false" aria-controls="chart">分布</button></div></div><div id="chart" class="chart"></div><div class="chart-meta"><span id="chart-legend" class="legend"><i></i>日均 ao5（秒） · 未训练日沿用上次</span><div id="chart-caption" class="chart-caption"></div></div></section>
          <section class="card analysis-card"><div class="card-heading"><h3>训练分析</h3></div><div id="analysis" class="analysis"></div></section>
        </div>
        <details class="card history-card"><summary class="card-heading"><h3>成绩记录 <span id="record-count" class="badge">0</span></h3><span class="disclosure-label">展开 / 收起明细</span></summary><div class="table-wrap"><table><thead><tr><th>训练日期</th><th>ao5（源表精度）</th><th>备注</th><th>来源单元格</th></tr></thead><tbody id="records-body"></tbody></table></div><div id="pagination" class="pagination" hidden><button id="prev-page" type="button">上一页</button><span id="page-info"></span><button id="next-page" type="button">下一页</button></div></details>
      </section>
      <section id="comparison-panel" role="tabpanel" aria-labelledby="comparison-tab" hidden><section class="card"><div class="card-heading"><h3>多人训练对比</h3></div><p id="competition-summary" class="competition-summary" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>人员</th><th>累计比分</th><th>总组数 / DNF</th><th>最佳 ao5</th><th>平均 ao5</th><th>Sub7 率</th><th>标准差</th></tr></thead><tbody id="comparison-body"></tbody></table></div></section>
        <section class="card fun-card" aria-labelledby="fun-title"><div class="card-heading"><h3 id="fun-title">趣味统计</h3></div><div class="fun-metrics" aria-live="polite"><div class="fun-metric"><span>三人都 Sub7</span><strong id="fun-sub7-3">—</strong><small id="fun-sub7-3-count">暂无样本</small></div><div class="fun-metric"><span>至少两人 Sub7</span><strong id="fun-sub7-2">—</strong><small id="fun-sub7-2-count">暂无样本</small></div><div class="fun-metric"><span>至少一人 Sub7</span><strong id="fun-sub7-1">—</strong><small id="fun-sub7-1-count">暂无样本</small></div></div><p id="fun-summary" class="fun-summary"></p></section>
      </section>
    </main>
  </div>
  <noscript><p class="notice">请启用 JavaScript 后重试。</p></noscript>
</body>
</html>
